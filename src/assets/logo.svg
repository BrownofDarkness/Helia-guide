<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="32" height="32" role="img" aria-label="Helia">
  <title>Helia</title>
  <defs>
    <!-- Soleil central : dégradé radial cream → ambre → orange-foncé -->
    <radialGradient id="helia-sun" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="60%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </radialGradient>
  </defs>

  <!-- 5 chevrons `>` (style terminal) en orbite, pointant radialement vers l'extérieur.
       Couleurs identiques aux 5 parcours fil-rouge du guide. -->
  <g fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 26 16 L 32 9 L 38 16" stroke="#c97744" transform="rotate(0 32 32)" />
    <path d="M 26 16 L 32 9 L 38 16" stroke="#4a8aaf" transform="rotate(72 32 32)" />
    <path d="M 26 16 L 32 9 L 38 16" stroke="#5a9469" transform="rotate(144 32 32)" />
    <path d="M 26 16 L 32 9 L 38 16" stroke="#b974a8" transform="rotate(216 32 32)" />
    <path d="M 26 16 L 32 9 L 38 16" stroke="#7569a5" transform="rotate(288 32 32)" />
  </g>

  <!-- Point lumineux central avec halo -->
  <circle cx="32" cy="32" r="6" fill="url(#helia-sun)" />
  <circle cx="30.5" cy="30.5" r="1.8" fill="#ffffff" opacity="0.5" />
</svg>
